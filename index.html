
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Titan Gym | Member Verification</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 25px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101827;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 15px 45px rgba(0,0,0,.3);
      text-align: center;
    }

    .logo {
      color: #d71920;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 5px;
      color: #777;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h2 {
      margin-top: 25px;
      font-size: 21px;
      color: #172033;
    }

    .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 9px 20px;
      border-radius: 30px;
      background: #e8f8ee;
      color: #15803d;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .badge.inactive {
      background: #feecec;
      color: #dc2626;
    }

    .badge.pending {
      background: #fff4dc;
      color: #a16207;
    }

    .message {
      margin: 18px 0;
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    .qr-container {
      margin: 20px auto;
      padding: 12px;
      width: 160px;
      height: 160px;
      border: 1px solid #eee;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .details {
      margin-top: 22px;
      text-align: left;
      border-top: 1px solid #eee;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }

    .detail-row span:first-child {
      color: #777;
    }

    .detail-row span:last-child {
      font-weight: bold;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .loading {
      margin: 25px 0;
      color: #666;
      font-size: 14px;
    }

    .error {
      color: #dc2626;
      font-weight: bold;
    }

    .footer {
      margin-top: 25px;
      color: #999;
      font-size: 11px;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">TITAN GYM</div>
    <div class="subtitle">Member Verification System</div>

    <h2>Membership Status</h2>

    <div id="badge" class="badge pending">
      VERIFYING MEMBER...
    </div>

    <p id="message" class="message">
      Please wait while we verify your membership.
    </p>

    <div id="qrContainer" class="qr-container hidden">
      <img id="qrImage" alt="Member verification QR code">
    </div>

    <section id="details" class="details hidden">

      <div class="detail-row">
        <span>Full Name</span>
        <span id="memberName">-</span>
      </div>

      <div class="detail-row">
        <span>Member ID</span>
        <span id="memberId">-</span>
      </div>

      <div class="detail-row">
        <span>Membership</span>
        <span id="membership">-</span>
      </div>

      <div class="detail-row">
        <span>Due Date</span>
        <span id="expiryDate">-</span>
      </div>

      <div class="detail-row">
        <span>Status</span>
        <span id="status">-</span>
      </div>

      <div class="detail-row">
        <span>Days Remaining</span>
        <span id="daysRemaining">-</span>
      </div>

    </section>

    <p class="footer">
      TITAN GYM<br>
      Official Membership Verification<br>
      For assistance, please contact the gym staff.
    </p>

  </main>

  <script>
    // NEW GOOGLE APPS SCRIPT WEB APP URL
    const API_URL = "https://script.google.com/macros/s/AKfycbw75k3S73oRCwUS7_v3LhdK5WU4Q9Pya969leROgOkfAMTiRwRQoyjGUoshgMasGqNiUQ/exec";

    const params = new URLSearchParams(window.location.search);
    const memberId = params.get("id");

    const badge = document.getElementById("badge");
    const message = document.getElementById("message");
    const details = document.getElementById("details");
    const qrContainer = document.getElementById("qrContainer");

    function showError(text) {
      badge.textContent = "VERIFICATION FAILED";
      badge.className = "badge inactive";
      message.textContent = text;
      message.className = "message error";
      details.classList.add("hidden");
      qrContainer.classList.add("hidden");
    }

    function formatDate(value) {
      if (!value) return "-";

      const date = new Date(value + "T00:00:00");

      if (isNaN(date.getTime())) return value;

      return date.toLocaleDateString("en-PH", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    function verifyMember() {
      if (!memberId) {
        showError("No Member ID was provided. Please scan a valid Titan Gym member QR code.");
        return;
      }

      const callbackName =
        "titanVerify_" + Date.now() + "_" +
        Math.floor(Math.random() * 100000);

      let script = document.createElement("script");
      let completed = false;

      const cleanup = () => {
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        delete window[callbackName];
      };

      const timeout = setTimeout(() => {
        if (completed) return;

        completed = true;
        cleanup();
        showError("Connection timed out. Please try again later.");
      }, 15000);

      window[callbackName] = function(data) {
        if (completed) return;

        completed = true;
        clearTimeout(timeout);
        cleanup();

        if (!data || !data.ok) {
          showError(data?.error || "Member not found.");
          return;
        }

        displayMember(data);
      };

      script.onerror = function() {
        if (completed) return;

        completed = true;
        clearTimeout(timeout);
        cleanup();

        showError("Unable to connect to the verification server.");
      };

      const requestUrl =
        API_URL +
        "?action=verify" +
        "&id=" + encodeURIComponent(memberId) +
        "&callback=" + encodeURIComponent(callbackName);

      script.src = requestUrl;
      document.body.appendChild(script);
    }

    function displayMember(data) {
      const memberStatus = String(data.status || "UNKNOWN").toUpperCase();
      const isActive = memberStatus === "ACTIVE";

      badge.textContent = isActive ? "ACTIVE MEMBER" : memberStatus;
      badge.className = isActive
        ? "badge"
        : "badge inactive";

      message.textContent = isActive
        ? "Your Titan Gym membership has been successfully verified."
        : "Your membership has been found, but it is currently not active.";

      document.getElementById("memberName").textContent =
        data.name || "-";

      document.getElementById("memberId").textContent =
        data.memberId || memberId;

      document.getElementById("membership").textContent =
        data.membership || "-";

      document.getElementById("expiryDate").textContent =
        formatDate(data.expiryDate);

      document.getElementById("status").textContent =
        memberStatus;

      document.getElementById("daysRemaining").textContent =
        data.daysRemaining !== undefined
          ? data.daysRemaining
          : "-";

      details.classList.remove("hidden");

      // Display QR code for this verification page.
      const qrImage = document.getElementById("qrImage");
      qrImage.src =
        "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
        encodeURIComponent(window.location.href);

      qrContainer.classList.remove("hidden");
    }

    verifyMember();
  </script>

</body>
</html>

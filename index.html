
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Titan Gym Member Verification</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{margin:0;padding:20px;background:#111827;font-family:Arial,sans-serif}
.card{max-width:420px;margin:auto;background:white;border-radius:20px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.logo{text-align:center;font-size:32px;font-weight:900;color:#dc2626}
.title{text-align:center;font-size:20px;font-weight:bold;margin:10px 0}
.badge{text-align:center;background:#dcfce7;color:#166534;padding:10px;border-radius:20px;font-weight:bold;margin:15px 0}
.qrbox{text-align:center;margin:20px 0}
.details{background:#f8fafc;border-radius:15px;padding:15px}
.row{padding:10px 0;border-bottom:1px solid #ddd}
.row:last-child{border-bottom:none}
.label{font-weight:bold}
#message{text-align:center;font-size:13px;margin:12px 0;color:#555}
</style>
</head>

<body>
<div class="card">
  <div class="logo">TITAN GYM</div>
  <div class="title">Member Verification</div>
  <div class="badge" id="badge">CHECKING MEMBERSHIP...</div>

  <div class="qrbox">
    <div id="memberQR"></div>
    <p>Member Verification Link</p>
  </div>

  <div id="message">Connecting to member database...</div>

  <div class="details">
    <div class="row"><span class="label">Name:</span> <span id="name">-</span></div>
    <div class="row"><span class="label">Member ID:</span> <span id="id">-</span></div>
    <div class="row"><span class="label">Membership:</span> <span id="membership">-</span></div>
    <div class="row"><span class="label">Due Date:</span> <span id="due">-</span></div>
    <div class="row"><span class="label">Status:</span> <span id="status">-</span></div>
    <div class="row"><span class="label">Days Remaining:</span> <span id="days">-</span></div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyTdR-pCCOwiWUL5Poua53l1dxErsytgFs_WhQpP4T9docKwymcMfmDe5EHwc8hbRb7dA/exec";

const params = new URLSearchParams(window.location.search);
const memberId = params.get("id");

function show(id, value) {
  document.getElementById(id).textContent =
    value === null || value === undefined || value === "" ? "-" : value;
}

function showError(message) {
  document.getElementById("badge").textContent = "VERIFICATION FAILED";
  document.getElementById("badge").style.background = "#fee2e2";
  document.getElementById("badge").style.color = "#991b1b";
  document.getElementById("message").textContent = message;
}

if (memberId) {
  show("id", memberId);

  new QRCode(document.getElementById("memberQR"), {
    text: window.location.href,
    width: 180,
    height: 180
  });

  const callbackName = "titanVerifyCallback";

  window[callbackName] = function(data) {
    if (!data || !data.ok) {
      showError(data && data.error ? data.error : "Member not found.");
      return;
    }

    show("name", data.name);
    show("id", data.memberId);
    show("membership", data.membership);
    show("due", data.expiryDate ? new Date(data.expiryDate).toLocaleDateString() : "-");
    show("status", data.status);
    show("days", data.daysRemaining);

    const active = data.status === "ACTIVE";
    document.getElementById("badge").textContent =
      active ? "VERIFIED MEMBER" : "MEMBERSHIP EXPIRED";

    document.getElementById("badge").style.background =
      active ? "#dcfce7" : "#fee2e2";

    document.getElementById("badge").style.color =
      active ? "#166534" : "#991b1b";

    document.getElementById("message").textContent =
      "Membership information updated from Titan Gym database.";
  };

  const script = document.createElement("script");
  script.src = API_URL +
    "?action=verify&id=" + encodeURIComponent(memberId) +
    "&callback=" + callbackName;

  script.onerror = function() {
    showError("Unable to connect. Please try again.");
  };

  document.body.appendChild(script);

} else {
  showError("No Member ID found in this link.");
}
</script>
</body>
</html>
